name: Deploy Mini App

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      version_ref:
        description: Saved Mini App tag to deploy (empty means main)
        required: false
        type: string
      request_id:
        description: Unique Control Center deployment request
        required: false
        type: string

run-name: Mini App ${{ inputs.request_id || github.sha }}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.version_ref || github.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          VITE_PAPA_BOT_API_URL: ${{ vars.PAPA_BOT_PUBLIC_URL }}
          VITE_DEFAULT_COMMUNITY_ID: ${{ vars.DEFAULT_COMMUNITY_ID }}
          VITE_BASE_PATH: /papa-bot-vk-miniapp/

      - name: Record source revision
        run: node -e "require('fs').writeFileSync('dist/release.json', JSON.stringify({sha:require('child_process').execFileSync('git',['rev-parse','HEAD'],{encoding:'utf8'}).trim()}))"

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
